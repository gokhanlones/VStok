<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>VStok</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #F5F7FA; font-family: 'Barlow', system-ui, sans-serif; }

    /* Banner */
    .banner { position: fixed; top: 0; left: 0; right: 0; height: 56px; background: #0A1520; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; padding-top: env(safe-area-inset-top,0px); z-index: 100; }
    .btn-hamburger { background: none; border: none; cursor: pointer; display: flex; flex-direction: column; gap: 5px; padding: 4px; }
    .btn-hamburger span { display: block; width: 22px; height: 2px; background: #D8E6F0; border-radius: 2px; }
    .banner-title { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; color: #D8E6F0; position: absolute; left: 50%; transform: translateX(-50%); }
    .banner-title span { color: #3D9BE9; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #1E3A5F; border: 1.5px solid #3D9BE9; }

    /* Sidebar */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
    .overlay.open { opacity: 1; pointer-events: all; }
    .sidebar { position: fixed; top: 0; left: 0; width: 75vw; max-width: 300px; height: 100%; background: #fff; z-index: 300; transform: translateX(-100%); transition: transform 0.3s ease; }
    .sidebar.open { transform: translateX(0); }

    /* İçerik */
    .content { margin-top: 56px; padding: 20px 16px; padding-bottom: calc(88px + env(safe-area-inset-bottom,0px)); }

    /* Ürün kartları */
    .urun-liste { display: flex; flex-direction: column; gap: 12px; }
    .urun-kart {
      background: #fff; border-radius: 12px; padding: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
      display: flex; gap: 12px; align-items: stretch;
      cursor: pointer; user-select: none;
    }
    .urun-renk-bar { width: 4px; border-radius: 4px; flex-shrink: 0; }
    .urun-icerik { flex: 1; }
    .urun-kart-ust { display: flex; justify-content: space-between; align-items: flex-start; }
    .urun-ad { font-size: 16px; font-weight: 700; color: #0A1520; }
    .urun-miktar { font-size: 14px; font-weight: 700; color: #3D9BE9; white-space: nowrap; }
    .urun-alt { margin-top: 4px; font-size: 12px; font-weight: 300; color: #4A6780; }
    .skt-chip { display: inline-block; margin-top: 8px; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
    .miktar-gecmis { margin-top: 10px; padding-top: 10px; border-top: 1px solid #F0F4F8; display: flex; flex-direction: column; gap: 4px; }
    .urun-miktar-log { display: flex; justify-content: space-between; font-size: 12px; font-weight: 300; color: #4A6780; }
    .urun-miktar-log span:first-child { font-weight: 700; color: #0A1520; }
    .skt-ok   { background: #E8F8F0; color: #27AE60; }
    .skt-uyar { background: #FEF3E2; color: #F39C12; }
    .skt-krit { background: #FDEDEC; color: #E74C3C; }

    /* Boş durum */
    .bos-durum { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; height: calc(100vh - 120px); color: #4A6780; }
    .bos-durum-ikon { font-size: 48px; opacity: 0.3; }
    .bos-durum-yazi { font-size: 14px; font-weight: 300; }

    /* FAB */
    .fab { position: fixed; bottom: calc(24px + env(safe-area-inset-bottom,0px)); right: 24px; width: 56px; height: 56px; border-radius: 50%; background: #3D9BE9; color: #fff; font-size: 28px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px rgba(61,155,233,0.4); z-index: 100; }

    /* Bottom Sheet */
    .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 400; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
    .sheet-overlay.open { opacity: 1; pointer-events: all; }
    .sheet { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-radius: 20px 20px 0 0; z-index: 500; padding: 0 20px; padding-bottom: calc(24px + env(safe-area-inset-bottom,0px)); max-height: 90vh; overflow-y: auto; transform: translateY(100%); transition: transform 0.3s ease; }
    .sheet.open { transform: translateY(0); }
    .sheet-handle { width: 40px; height: 4px; background: #D0DCE8; border-radius: 2px; margin: 14px auto 20px; }
    .sheet-title { font-size: 18px; font-weight: 700; color: #0A1520; margin-bottom: 20px; }

    /* Form */
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .form-label { font-size: 12px; font-weight: 700; color: #4A6780; letter-spacing: 0.5px; }
    .form-input { padding: 12px 14px; border: 1.5px solid #D0DCE8; border-radius: 8px; font-family: 'Barlow', system-ui, sans-serif; font-size: 15px; font-weight: 300; color: #0A1520; outline: none; width: 100%; transition: border-color 0.2s; }
    .form-input:focus { border-color: #3D9BE9; }
    .miktar-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .birim-btn { padding: 12px 14px; border: 1.5px solid #3D9BE9; border-radius: 8px; background: #EBF5FD; color: #3D9BE9; font-family: 'Barlow', system-ui, sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; text-align: left; display: flex; align-items: center; justify-content: space-between; }

    /* Renk satırı */
    .renk-row { display: flex; align-items: center; gap: 12px; }
    .renk-input { width: 48px; height: 44px; border: 1.5px solid #D0DCE8; border-radius: 8px; cursor: pointer; padding: 4px; background: none; }
    .renk-label-text { font-size: 14px; font-weight: 300; color: #4A6780; }

    .btn-kaydet { width: 100%; padding: 14px; background: #0A1520; color: #fff; font-family: 'Barlow', system-ui, sans-serif; font-size: 15px; font-weight: 700; border: none; border-radius: 10px; cursor: pointer; margin-top: 8px; }

    /* Sil modalı */
    .sil-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 600; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .sil-overlay.open { opacity: 1; pointer-events: all; }
    .sil-kart { background: #fff; border-radius: 16px; padding: 28px 24px; width: calc(100% - 48px); max-width: 320px; display: flex; flex-direction: column; gap: 20px; }
    .sil-baslik { font-size: 17px; font-weight: 700; color: #0A1520; }
    .sil-metin { font-size: 14px; font-weight: 300; color: #4A6780; }
    .sil-butonlar { display: flex; gap: 12px; justify-content: flex-end; }
    .btn-vazgec { padding: 10px 20px; border: none; background: none; color: #4A6780; font-family: 'Barlow', system-ui, sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; }
    .btn-sil-onayla { padding: 10px 24px; border: none; background: #E74C3C; color: #fff; font-family: 'Barlow', system-ui, sans-serif; font-size: 14px; font-weight: 700; border-radius: 8px; cursor: pointer; }
    .miktar-guncelle-row { display: flex; align-items: center; justify-content: center; gap: 12px; }
    .miktar-btn { width: 44px; height: 44px; border-radius: 50%; border: none; background: #0A1520; color: #fff; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .miktar-guncelle-input { width: 100px; text-align: center; padding: 10px; border: 1.5px solid #D0DCE8; border-radius: 8px; font-family: 'Barlow', system-ui, sans-serif; font-size: 18px; font-weight: 700; color: #0A1520; outline: none; }
    .miktar-guncelle-input:focus { border-color: #3D9BE9; }
    .btn-miktar-kaydet { width: 100%; padding: 12px; background: #3D9BE9; color: #fff; font-family: 'Barlow', system-ui, sans-serif; font-size: 14px; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; }
    .sil-ayrac { border: none; border-top: 1px solid #F0F4F8; margin: 4px 0; }
  </style>
</head>
<body>

  <header class="banner">
    <button class="btn-hamburger" id="btn-menu"><span></span><span></span><span></span></button>
    <div class="banner-title">V<span>S</span>tok</div>
    <img class="avatar" id="avatar" src="" alt="">
  </header>

  <div class="overlay" id="overlay"></div>
  <aside class="sidebar" id="sidebar"></aside>

  <main class="content">
    <div class="urun-liste" id="urun-liste"></div>
  </main>

  <button class="fab" id="fab">+</button>

  <!-- Bottom Sheet -->
  <div class="sheet-overlay" id="sheet-overlay"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="sheet-title">Yeni Ürün</div>

    <div class="form-group">
      <div class="form-label">Ürün Adı *</div>
      <input class="form-input" id="f-ad" type="text" placeholder="Ürün adı">
    </div>
    <div class="miktar-row">
      <div class="form-group">
        <div class="form-label">Miktar *</div>
        <input class="form-input" id="f-miktar" type="number" min="0" step="any" placeholder="0">
      </div>
      <div class="form-group">
        <div class="form-label">Birim *</div>
        <button class="birim-btn" id="f-birim"><span id="birim-label">Adet</span><span>⇅</span></button>
      </div>
    </div>
    <div class="form-group">
      <div class="form-label">Renk</div>
      <input class="form-input" id="f-renk" type="text" placeholder="Kırmızı, Mavi, RAL 3000…">
    </div>
    <div class="form-group">
      <div class="form-label">Marka</div>
      <input class="form-input" id="f-marka" type="text" placeholder="Marka">
    </div>
    <div class="form-group">
      <div class="form-label">Model</div>
      <input class="form-input" id="f-model" type="text" placeholder="Model">
    </div>
    <div class="form-group">
      <div class="form-label">Tip</div>
      <input class="form-input" id="f-tip" type="text" placeholder="Tip">
    </div>
    <div class="form-group">
      <div class="form-label">Seri No</div>
      <input class="form-input" id="f-seri" type="text" placeholder="Seri numarası">
    </div>
    <div class="form-group">
      <div class="form-label">SKT</div>
      <input class="form-input" id="f-skt" type="date">
    </div>
    <div class="form-group">
      <div class="form-label">Not</div>
      <input class="form-input" id="f-not" type="text" placeholder="Not">
    </div>
    <button class="btn-kaydet" id="btn-kaydet">Kaydet</button>
  </div>

  <!-- Uzun basma modalı -->
  <div class="sil-overlay" id="sil-overlay">
    <div class="sil-kart">
      <div class="sil-baslik" id="sil-urun-ad"></div>

      <!-- Miktar güncelleme -->
      <div class="miktar-guncelle-row">
        <button class="miktar-btn" id="btn-miktar-azalt">−</button>
        <input class="miktar-guncelle-input" id="miktar-guncelle-val" type="number" min="0" step="any">
        <button class="miktar-btn" id="btn-miktar-artir">+</button>
      </div>
      <button class="btn-miktar-kaydet" id="btn-miktar-kaydet">Miktarı Güncelle</button>

      <div class="sil-ayrac"></div>

      <div class="sil-butonlar">
        <button class="btn-vazgec" id="btn-vazgec">Vazgeç</button>
        <button class="btn-sil-onayla" id="btn-sil-onayla">Sil</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp }  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { urunEkle, urunleriGetir, urunGuncelle, urunSil, miktarEkle, miktarlariGetir } from './db.js';

    initializeApp({
      apiKey: "AIzaSyDhf0oH-g4c-gPRNGAnuET6kT8T3eeYFKg",
      authDomain: "vstok-4541b.firebaseapp.com",
      projectId: "vstok-4541b",
      storageBucket: "vstok-4541b.firebasestorage.app",
      messagingSenderId: "987977489899",
      appId: "1:987977489899:web:ea79e1e82e23c935e2cdae"
    });

    const auth   = getAuth();
    const params = new URLSearchParams(location.search);
    const alanId = parseInt(params.get('id'));

    onAuthStateChanged(auth, user => {
      if (!user) { location.href = 'auth.html'; return; }
      if (user.photoURL) document.getElementById('avatar').src = user.photoURL;
    });

    // ── Birim döngüsü ─────────────────────────────────────────────
    const birimler = ['Adet','Litre','Inch','Çap','Ağırlık - g','Ağırlık - kg','Ağırlık - ton','Yükseklik - mm','Yükseklik - cm','Yükseklik - m','Genişlik - mm','Genişlik - cm','Genişlik - m'];
    let birimIndex = 0;
    document.getElementById('f-birim').addEventListener('click', () => {
      birimIndex = (birimIndex + 1) % birimler.length;
      document.getElementById('birim-label').textContent = birimler[birimIndex];
    });

    // ── SKT chip ──────────────────────────────────────────────────
    function sktChip(skt) {
      if (!skt) return '';
      const gun = Math.ceil((new Date(skt) - new Date()) / 86400000);
      if (gun < 0)   return `<div class="skt-chip skt-krit">SKT geçti</div>`;
      if (gun <= 10) return `<div class="skt-chip skt-krit">SKT ${gun}g</div>`;
      if (gun <= 30) return `<div class="skt-chip skt-uyar">SKT ${gun}g</div>`;
      return `<div class="skt-chip skt-ok">SKT ${new Date(skt).toLocaleDateString('tr-TR')}</div>`;
    }

    // ── Liste ──────────────────────────────────────────────────────
    function tarihFormat(ts) {
      const d = new Date(ts);
      return d.toLocaleDateString('tr-TR') + ' ' + d.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
    }

    async function listeGuncelle() {
      const liste   = document.getElementById('urun-liste');
      const urunler = await urunleriGetir(alanId);

      if (urunler.length === 0) {
        liste.innerHTML = `<div class="bos-durum"><div class="bos-durum-ikon">📋</div><div class="bos-durum-yazi">Henüz ürün yok. + ile ekle.</div></div>`;
        return;
      }

      const kartlar = await Promise.all(urunler.map(async u => {
        const gecmis = await miktarlariGetir(u.id);
        const gecmisSatirlar = gecmis.length
          ? `<div class="miktar-gecmis">${gecmis.map(m =>
              `<div class="urun-miktar-log">
                <span>${m.miktar} ${u.birim}</span>
                <span>${tarihFormat(m.tarih)}</span>
              </div>`).join('')}
            </div>`
          : '';
        return `
          <div class="urun-kart" data-id="${u.id}">
            <div class="urun-icerik">
              <div class="urun-kart-ust">
                <div class="urun-ad">${u.ad}</div>
                <div class="urun-miktar">${u.miktar} ${u.birim}</div>
              </div>
              <div class="urun-alt">${[u.marka,u.model,u.tip,u.seri_no,u.renk].filter(Boolean).join(' · ')}</div>
              ${sktChip(u.skt)}
              ${gecmisSatirlar}
            </div>
          </div>`;
      }));

      liste.innerHTML = kartlar.join('');

      // Tap → düzenle, Long press → sil
      liste.querySelectorAll('.urun-kart').forEach(kart => {
        let timer = null;

        kart.addEventListener('touchstart', () => {
          timer = setTimeout(() => { timer = null; silModuAc(parseInt(kart.dataset.id)); }, 600);
        });
        kart.addEventListener('touchend', async () => {
          if (timer) { clearTimeout(timer); duzenleAc(parseInt(kart.dataset.id)); }
        });
        kart.addEventListener('touchmove', () => { if (timer) clearTimeout(timer); timer = null; });

        // Masaüstü için
        kart.addEventListener('contextmenu', e => { e.preventDefault(); silModuAc(parseInt(kart.dataset.id)); });
        kart.addEventListener('click', () => duzenleAc(parseInt(kart.dataset.id)));
      });
    }

    listeGuncelle();

    // ── Sheet ──────────────────────────────────────────────────────
    const sheet        = document.getElementById('sheet');
    const sheetOverlay = document.getElementById('sheet-overlay');
    let editId         = null;

    function formuTemizle() {
      ['f-ad','f-miktar','f-marka','f-model','f-tip','f-seri','f-skt','f-not'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('f-renk').value = '';
      birimIndex = 0;
      document.getElementById('birim-label').textContent = 'Adet';
    }

    function openSheet(baslik) {
      document.getElementById('sheet-title').textContent = baslik;
      sheet.classList.add('open'); sheetOverlay.classList.add('open');
    }
    function closeSheet() {
      sheet.classList.remove('open'); sheetOverlay.classList.remove('open');
      editId = null; formuTemizle();
    }

    async function duzenleAc(id) {
      const urunler = await urunleriGetir(alanId);
      const u = urunler.find(x => x.id === id);
      if (!u) return;
      editId = id;
      document.getElementById('f-ad').value    = u.ad;
      document.getElementById('f-miktar').value = u.miktar;
      document.getElementById('f-marka').value  = u.marka || '';
      document.getElementById('f-model').value  = u.model || '';
      document.getElementById('f-tip').value    = u.tip   || '';
      document.getElementById('f-seri').value   = u.seri_no || '';
      document.getElementById('f-skt').value    = u.skt   || '';
      document.getElementById('f-not').value    = u.notlar || '';
      document.getElementById('f-renk').value   = u.renk  || '';
      birimIndex = birimler.indexOf(u.birim);
      if (birimIndex < 0) birimIndex = 0;
      document.getElementById('birim-label').textContent = birimler[birimIndex];
      openSheet('Düzenle');
    }

    document.getElementById('fab').addEventListener('click', () => { editId = null; formuTemizle(); openSheet('Yeni Ürün'); });
    sheetOverlay.addEventListener('click', closeSheet);

    document.getElementById('btn-kaydet').addEventListener('click', async () => {
      const ad     = document.getElementById('f-ad').value.trim();
      const miktar = parseFloat(document.getElementById('f-miktar').value);
      if (!ad || isNaN(miktar)) return;

      const veri = {
        ad, miktar, birim: birimler[birimIndex],
        marka:   document.getElementById('f-marka').value.trim(),
        model:   document.getElementById('f-model').value.trim(),
        tip:     document.getElementById('f-tip').value.trim(),
        seri_no: document.getElementById('f-seri').value.trim(),
        skt:     document.getElementById('f-skt').value || null,
        notlar:  document.getElementById('f-not').value.trim(),
        renk:    document.getElementById('f-renk').value
      };

      if (editId) {
        await urunGuncelle(editId, veri);
        await miktarEkle(editId, veri.miktar);
      } else {
        const yeniId = await urunEkle(alanId, veri);
        await miktarEkle(yeniId, veri.miktar);
      }

      closeSheet();
      await listeGuncelle();
    });

    // ── Uzun basma modalı ─────────────────────────────────────────
    const silOverlay = document.getElementById('sil-overlay');
    let silId = null;

    async function silModuAc(id) {
      silId = id;
      const urunler = await urunleriGetir(alanId);
      const u = urunler.find(x => x.id === id);
      if (!u) return;
      document.getElementById('sil-urun-ad').textContent = u.ad;
      document.getElementById('miktar-guncelle-val').value = u.miktar;
      silOverlay.classList.add('open');
    }

    function silKapat() { silOverlay.classList.remove('open'); silId = null; }

    document.getElementById('btn-vazgec').addEventListener('click', silKapat);

    document.getElementById('btn-miktar-azalt').addEventListener('click', () => {
      const inp = document.getElementById('miktar-guncelle-val');
      const yeni = Math.max(0, parseFloat(inp.value || 0) - 1);
      inp.value = yeni;
    });

    document.getElementById('btn-miktar-artir').addEventListener('click', () => {
      const inp = document.getElementById('miktar-guncelle-val');
      inp.value = parseFloat(inp.value || 0) + 1;
    });

    document.getElementById('btn-miktar-kaydet').addEventListener('click', async () => {
      if (!silId) return;
      const yeniMiktar = parseFloat(document.getElementById('miktar-guncelle-val').value);
      if (isNaN(yeniMiktar)) return;
      await urunGuncelle(silId, { miktar: yeniMiktar });
      await miktarEkle(silId, yeniMiktar);
      silKapat();
      await listeGuncelle();
    });

    document.getElementById('btn-sil-onayla').addEventListener('click', async () => {
      if (silId) await urunSil(silId);
      silKapat();
      await listeGuncelle();
    });

    // ── Sidebar ───────────────────────────────────────────────────
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    document.getElementById('btn-menu').addEventListener('click', () => { sidebar.classList.add('open'); overlay.classList.add('open'); });
    overlay.addEventListener('click', () => { sidebar.classList.remove('open'); overlay.classList.remove('open'); });
  </script>
</body>
</html>
