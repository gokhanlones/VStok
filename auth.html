<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>VStok — Giriş</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #0A1520;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Barlow', system-ui, sans-serif;
    }
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }
    .brand {
      font-size: clamp(48px, 15vw, 72px);
      font-weight: 700;
      letter-spacing: -2px;
      color: #D8E6F0;
    }
    .brand span { color: #3D9BE9; }
    .btn-google {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 28px;
      background: #fff;
      color: #1a1a1a;
      font-family: 'Barlow', system-ui, sans-serif;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 0.2px;
    }
    .btn-google svg { width: 20px; height: 20px; }
    .error {
      color: #e74c3c;
      font-size: 13px;
      font-weight: 300;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">V<span>S</span>tok</div>
    <button class="btn-google" id="btn-google">
      <svg viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.14 0 5.95 1.08 8.17 2.86l6.1-6.1C34.46 3.09 29.52 1 24 1 14.82 1 7.07 6.48 3.64 14.22l7.1 5.52C12.4 13.67 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.52 24.5c0-1.64-.15-3.22-.42-4.75H24v9h12.7c-.55 2.97-2.2 5.48-4.67 7.17l7.18 5.57C43.27 37.27 46.52 31.36 46.52 24.5z"/>
        <path fill="#FBBC05" d="M10.74 28.26A14.6 14.6 0 0 1 9.5 24c0-1.48.26-2.91.74-4.26l-7.1-5.52A23.93 23.93 0 0 0 0 24c0 3.86.93 7.5 2.59 10.72l8.15-6.46z"/>
        <path fill="#34A853" d="M24 47c5.52 0 10.15-1.83 13.53-4.96l-7.18-5.57C28.6 37.74 26.42 38.5 24 38.5c-6.26 0-11.6-4.17-13.26-9.74l-8.15 6.46C6.07 42.52 14.45 47 24 47z"/>
      </svg>
      Google ile Giriş Yap
    </button>
    <div class="error" id="error">Giriş başarısız, tekrar dene.</div>
  </div>

  <script type="module">
    import { initializeApp }     from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const app = initializeApp({
      apiKey:            "AIzaSyDhf0oH-g4c-gPRNGAnuET6kT8T3eeYFKg",
      authDomain:        "vstok-4541b.firebaseapp.com",
      projectId:         "vstok-4541b",
      storageBucket:     "vstok-4541b.firebasestorage.app",
      messagingSenderId: "987977489899",
      appId:             "1:987977489899:web:ea79e1e82e23c935e2cdae"
    });

    const auth     = getAuth(app);
    const provider = new GoogleAuthProvider();

    document.getElementById('btn-google').addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, provider);
        location.href = 'app.html';
      } catch (e) {
        document.getElementById('error').style.display = 'block';
      }
    });
  </script>
</body>
</html>
