<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>VStok</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: #F5F7FA;
      font-family: 'Barlow', system-ui, sans-serif;
      overflow-x: hidden;
    }

    /* ── Banner ── */
    .banner {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 56px;
      background: #0A1520;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      padding-top: env(safe-area-inset-top, 0px);
      z-index: 100;
    }

    .btn-hamburger {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 4px;
    }
    .btn-hamburger span {
      display: block;
      width: 22px;
      height: 2px;
      background: #D8E6F0;
      border-radius: 2px;
    }

    .banner-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #D8E6F0;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }
    .banner-title span { color: #3D9BE9; }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      background: #1E3A5F;
      border: 1.5px solid #3D9BE9;
    }

    /* ── Sidebar ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .sidebar {
      position: fixed;
      top: 0; left: 0;
      width: 75vw;
      max-width: 300px;
      height: 100%;
      background: #fff;
      z-index: 300;
      transform: translateX(-100%);
      transition: transform 0.3s ease;
    }
    .sidebar.open {
      transform: translateX(0);
    }

    /* ── İçerik ── */
    .content {
      margin-top: 56px;
      height: calc(100% - 56px);
    }

    /* ── FAB ── */
    .fab {
      position: fixed;
      bottom: 24px;
      right: 24px;
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #3D9BE9;
      color: #fff;
      font-size: 28px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(61,155,233,0.4);
    }
  </style>
</head>
<body>

  <!-- Banner -->
  <header class="banner">
    <button class="btn-hamburger" id="btn-menu">
      <span></span><span></span><span></span>
    </button>
    <div class="banner-title">V<span>S</span>tok</div>
    <img class="avatar" id="avatar" src="" alt="">
  </header>

  <!-- Sidebar -->
  <div class="overlay" id="overlay"></div>
  <aside class="sidebar" id="sidebar"></aside>

  <!-- İçerik -->
  <main class="content"></main>

  <!-- FAB -->
  <button class="fab" id="fab">+</button>

  <script type="module">
    import { initializeApp }  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const app  = initializeApp({
      apiKey:            "AIzaSyDhf0oH-g4c-gPRNGAnuET6kT8T3eeYFKg",
      authDomain:        "vstok-4541b.firebaseapp.com",
      projectId:         "vstok-4541b",
      storageBucket:     "vstok-4541b.firebasestorage.app",
      messagingSenderId: "987977489899",
      appId:             "1:987977489899:web:ea79e1e82e23c935e2cdae"
    });

    const auth = getAuth(app);

    onAuthStateChanged(auth, user => {
      if (!user) { location.href = 'auth.html'; return; }
      const av = document.getElementById('avatar');
      if (user.photoURL) av.src = user.photoURL;
    });

    // Sidebar
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');

    function openSidebar()  { sidebar.classList.add('open'); overlay.classList.add('open'); }
    function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('open'); }

    document.getElementById('btn-menu').addEventListener('click', openSidebar);
    overlay.addEventListener('click', closeSidebar);
  </script>
</body>
</html>
